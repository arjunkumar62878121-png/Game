<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tic Tac Toe Pro</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #141e30, #243b55);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Glass UI */
.container {
  background: rgba(255,255,255,0.1);
  padding: 20px;
  border-radius: 15px;
  backdrop-filter: blur(10px);
  text-align: center;
}

/* Inputs */
input {
  padding: 8px;
  margin: 5px;
  border-radius: 5px;
  border: none;
  outline: none;
}

button {
  padding: 10px 20px;
  margin-top: 10px;
  border: none;
  border-radius: 5px;
  background: #ff9800;
  color: white;
  cursor: pointer;
}

/* Board */
.board {
  display: grid;
  grid-template-columns: repeat(3, 90px);
  gap: 10px;
  margin: 20px auto;
}

.cell {
  width: 90px;
  height: 90px;
  background: white;
  color: black;
  font-size: 2rem;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  border-radius: 10px;
}

.winning {
  background: #4CAF50 !important;
  color: white;
}

/* Confetti */
.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  background: red;
  top: 0;
  animation: fall 2s linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(100vh);
  }
}
</style>

</head>
<body>

<div class="container">

<h2>🏆 Tic Tac Toe Champions Arena 👑</h2>

<div id="setup">
  <input type="text" id="p1" placeholder="Player 1 Name">
  <input type="text" id="p2" placeholder="Player 2 Name">
  <br>
  <button onclick="startGame()">Start Game</button>
</div>

<div id="game" style="display:none;">
  <h3 id="status"></h3>

  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <button onclick="restartGame()">Restart</button>
</div>

</div>

<script>
let board = ["","","","","","","","",""];
let currentPlayer = "X";
let gameActive = true;

let player1 = "";
let player2 = "";

const cells = document.querySelectorAll(".cell");
const statusText = document.getElementById("status");

function startGame() {
  player1 = document.getElementById("p1").value || "Player 1";
  player2 = document.getElementById("p2").value || "Player 2";

  document.getElementById("setup").style.display = "none";
  document.getElementById("game").style.display = "block";

  statusText.textContent = `${player1}'s Turn (X)`;
}

cells.forEach(cell => cell.addEventListener("click", handleClick));

function handleClick(e) {
  const index = e.target.dataset.index;

  if (board[index] !== "" || !gameActive) return;

  board[index] = currentPlayer;
  e.target.textContent = currentPlayer;

  checkWinner();
}

const winConditions = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

function checkWinner() {
  for (let condition of winConditions) {
    let [a,b,c] = condition;

    if (board[a] && board[a] === board[b] && board[a] === board[c]) {

      document.querySelector(`[data-index='${a}']`).classList.add("winning");
      document.querySelector(`[data-index='${b}']`).classList.add("winning");
      document.querySelector(`[data-index='${c}']`).classList.add("winning");

      let winnerName = currentPlayer === "X" ? player1 : player2;

      statusText.textContent = `🎉 ${winnerName} Wins!`;

      gameActive = false;
      launchConfetti();
      return;
    }
  }

  if (!board.includes("")) {
    statusText.textContent = "🤝 Draw!";
    gameActive = false;
    return;
  }

  currentPlayer = currentPlayer === "X" ? "O" : "X";
  statusText.textContent = currentPlayer === "X"
    ? `${player1}'s Turn (X)`
    : `${player2}'s Turn (O)`;
}

function restartGame() {
  board = ["","","","","","","","",""];
  gameActive = true;
  currentPlayer = "X";

  cells.forEach(cell => {
    cell.textContent = "";
    cell.classList.remove("winning");
  });

  statusText.textContent = `${player1}'s Turn (X)`;
}

/* Confetti Animation */
function launchConfetti() {
  for (let i = 0; i < 100; i++) {
    let conf = document.createElement("div");
    conf.classList.add("confetti");
    conf.style.left = Math.random() * 100 + "vw";
    conf.style.backgroundColor = `hsl(${Math.random()*360},100%,50%)`;
    conf.style.animationDuration = (Math.random()*2+1) + "s";

    document.body.appendChild(conf);

    setTimeout(() => conf.remove(), 2000);
  }
}
</script>

</body>
</html>
